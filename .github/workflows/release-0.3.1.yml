name: Publish Tongzhou 0.3.1

on:
  push:
    branches: ['release/0.3.1']

permissions:
  contents: read

concurrency:
  group: tongzhou-release-0.3.1
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'PhoenixQian/dsh-codex-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.12.0'
      - name: Use the reviewed packaging toolchain
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Run portable compatibility regressions
        run: >-
          node --test --test-concurrency=1
          test/dsh-compat.test.mjs
          tests/session-codec.test.mjs
          tests/native-reading-codec.test.mjs
          tests/reading-format.test.mjs
          tests/capability-retry.test.mjs
          tests/capability-status-ui.test.mjs
      - name: Pack and verify the reviewed artifact
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync, mkdirSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {join} from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'tongzhou-release');
          mkdirSync(directory, {recursive: true});
          const packed = JSON.parse(execFileSync('npm', ['pack', '--ignore-scripts', '--json', '--pack-destination', directory], {encoding:'utf8'}))[0];
          if (packed.version !== '0.3.1' || packed.filename !== 'dsh-codex-bridge-0.3.1.tgz' || packed.files.length !== 49) throw Error('Unexpected release identity');
          for (const file of packed.files) {
            if (!/^(?:lib\/|client\/|server\/|skills\/|package\.json$|cordis\.patch\.yml$|README(?:\.en)?\.md$|CHANGELOG\.md$|LICENSE$)/.test(file.path)) throw Error('Unexpected package file: ' + file.path);
          }
          const archive = readFileSync(join(directory, packed.filename));
          const sha = createHash('sha256').update(archive).digest('hex');
          const tarSha = createHash('sha256').update(gunzipSync(archive)).digest('hex');
          console.log(JSON.stringify({filename:packed.filename, size:packed.size, files:packed.files.length, sha256:sha, tarSha256:tarSha, zlib:process.versions.zlib}));
          // Homebrew and official Linux Node builds link different zlib versions.
          // Require the entire decompressed tar stream to match the local verified
          // artifact, including every file byte and tar metadata, before publishing.
          if (tarSha !== 'de90803e1440b353fa12ac4d303fe559a036534f4b182ab9cbb4077885c1e011') throw Error('Package content differs from the verified local artifact');
          if (sha !== '3da3dbe6f4e003cca4bcb560dad7efc40c8b541f50a961f2d4c9e8a1c63046a5') throw Error('Unexpected Linux compression output');
          writeFileSync(join(directory, 'SHA256SUMS'), `${sha}  ${packed.filename}\n`);
          NODE
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.1 \
            "$RUNNER_TEMP/tongzhou-release/dsh-codex-bridge-0.3.1.tgz" \
            "$RUNNER_TEMP/tongzhou-release/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title '同舟 Tongzhou 0.3.1 · DSH rc.3 兼容更新' \
            --notes-file .github/releases/v0.3.1.md \
            --draft
          gh release edit v0.3.1 --draft=false --latest
